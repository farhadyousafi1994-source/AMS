    <rect x="34" y="28" width="3" height="4" fill="#0B1626"/>
    <rect x="27" y="36" width="3" height="4" fill="#0B1626"/>
    <rect x="34" y="36" width="3" height="4" fill="#0B1626"/>
    <path d="M2 52 L16 34 L30 52 Z" fill="#E8EEF6"/>
    <path d="M34 52 L48 36 L62 52 Z" fill="#E8EEF6"/>
